spring.application.name=audit-log-service

# File-based (not in-memory) H2 so the DB survives restarts and can be inspected/tampered
# with directly via the H2 console at /h2-console - useful for the Scenario A tamper demo
# and for the live defense session.
spring.datasource.url=jdbc:h2:file:./data/auditlog;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Prototype-scope simplification: Hibernate manages the schema instead of versioned
# migrations. A production service would use Flyway/Liquibase instead - see
# ARCHITECTURE.md "Known limitations".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Scenario B retention: records older than this (by recordedAt) are eligible for archival via
# POST /audit/retention/archive. Override per-call with ?olderThanDays= for testing/demoing.
audit.retention.archive-after-days=90
